[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Documents"
desc = "Cd to ~/Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Downloads"
desc = "Cd to ~/Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Cd to ~/Pictures"

[[manager.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd /run/media/backup/Movie"
desc = "Cd to /run/media/backup/Movie"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "cd /run/media/backup/learn"
desc = "Cd to /run/media/backup/learn"

[[mgr.prepend_keymap]]
on   = [ "g", "b" ]
run  = "cd /run/media/backup"
desc = "Cd to /run/media/backup"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/.config"
desc = "Cd to ~/.config"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd ~/Music"
desc = "Cd to ~/Music"

[[manager.prepend_keymap]]


[[mgr.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd ~/.local/share/Trash/files"
desc = "Cd to Trash"

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd /opt"
desc = "Cd to /opt"

[[mgr.prepend_keymap]]
on   = [ "m", "P" ]
run  = [ '''
          shell 'phoneMount' --confirm
       ''' ]
desc = "mount phone"

[[mgr.prepend_keymap]]
on   = [ "m", "S" ]
run  = [ '''
          shell 'sh -c '\''echo "{ \"command\": [\"sub-add\", \"$1\"] }" | socat - /tmp/mpvsocket'\'' _ "$1"'
       ''' ]
desc = "Add Subtitle"

[[mgr.prepend_keymap]]
on   = [ "m", "z" ]
run = '''shell --block 'cd "%h/.." && zip -r "%h.zip" "$(basename "%h")"' '''
desc = "Zip a File Or Folder"

[[mgr.prepend_keymap]]
on = ["m", "u"]
run = '''shell --block 'udisksctl mount -b /dev/sda1' '''
desc = "Mount USB"

[[mgr.prepend_keymap]]
on = ["m", "U"]
run = '''shell --block 'udisksctl unmount -b /dev/sda1' '''
desc = "Unmount USB"
