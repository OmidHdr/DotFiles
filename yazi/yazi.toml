# ~/.config/yazi/yazi.toml
# Compatible with Yazi 26.5.6

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]


[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]


[opener]

edit = [
    { run = 'nvim %s', desc = "Neovim", block = true, for = "unix" },
    { run = 'code %s', orphan = true, desc = "VS Code", for = "windows" },
    { run = 'code -w %s', block = true, desc = "VS Code (block)", for = "windows" },
]

open = [
    { run = 'xdg-open %s1', desc = "Open", orphan = true, for = "linux" },
    { run = 'open %s', desc = "Open", orphan = true, for = "macos" },
    { run = 'start "" %s1', desc = "Open", orphan = true, for = "windows" },
]

reveal = [
    { run = 'xdg-open %d1', desc = "Reveal", orphan = true, for = "linux" },
    { run = 'open -R %s1', desc = "Reveal", orphan = true, for = "macos" },
    { run = 'explorer /select,%s1', desc = "Reveal", orphan = true, for = "windows" },

    { run = '''exiftool %s1; echo "Press Enter to exit"; read _''',
      desc = "Show EXIF",
      block = true,
      for = "unix" },
]

extract = [
    { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
    { run = 'ya pub extract --list %s', desc = "Extract here", for = "windows" },
]

play = [
    { run = 'mpv --force-window %s', orphan = true, desc = "Play", for = "unix" },
    { run = 'mpv --force-window %s', orphan = true, desc = "Play", for = "windows" },

    { run = '''mediainfo %s1; echo "Press Enter to exit"; read _''',
      desc = "Show media info",
      block = true,
      for = "unix" },
]

subtitle = [
    { run = '''printf 'sub-add "%s"\n' %s1 | socat - /tmp/mpvsocket''',
      desc = "Add subtitle to MPV",
      orphan = true,
      for = "linux" },
]


[open]
rules = [
    # Directory
    { url = "*/", use = ["open", "reveal"] },

    # Subtitle files — keep before text rules
    { url = "*.{ass,srt,ssa,sty,sup,vtt}", use = ["subtitle", "edit", "reveal"] },

    # Text
    { mime = "text/*", use = ["edit", "reveal"] },

    # JSON
    { mime = "application/{json,x-ndjson}", use = ["edit", "reveal"] },
    { mime = "*/javascript", use = ["edit", "reveal"] },

    # Images
    { mime = "image/*", use = ["open", "reveal"] },

    # Audio and video
    { mime = "{audio,video}/*", use = ["play", "reveal"] },

    # Archives
    { mime = "application/{,g}zip", use = ["extract", "reveal"] },
    { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = ["extract", "reveal"] },

    # Empty files
    { mime = "inode/x-empty", use = ["edit", "reveal"] },

    # Fallback
    { url = "*", use = ["open", "reveal"] },
]


[tasks]
file_workers = 10
plugin_workers = 25
fetch_workers = 10
preload_workers = 10
process_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false


[plugin]
# Uses the installed miller.yazi plugin for CSV previews.
# Remove this section if miller.yazi is not installed.
prepend_previewers = [
    { mime = "text/csv", run = "miller" },
]


[input]
cursor_blink = false

# Change directory
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# Create
create_title = ["Create:", "Create directory:"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# Rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# Filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# Find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# Search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# Shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]


[confirm]

# Trash
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# Permanent deletion
delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

# Overwrite
overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 20]

# Quit
quit_title = "Quit?"
quit_content = "A task is still running. Are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 20]


[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]


[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false

