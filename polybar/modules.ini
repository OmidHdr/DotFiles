[module/spacer]
type = custom/text
format = " "
[module/apple]
type = custom/text
format = %{O5px}
format-font = 9
click-left = python3 ~/.config/polybar/scripts/global-menu.py apple
click-right = nohup ~/.local/bin/polybar-theme toggle >/dev/null 2>&1 &

[module/global-menu]
type = custom/ipc
initial = 1
hook-0 = cat "$GLOBAL_MENU_CACHE/global-menu-$GLOBAL_MENU_TIER" 2>/dev/null || true

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
fuzzy-match = false
format = <label-state>
format-font = 2
# Inline offsets shift glyph ink within the existing circle. Each shift is
# undone after the glyph to keep its slot advance and click region unchanged.
# Point offsets account for DPI and Polybar rounds them to integer pixels.
ws-icon-0 = 1;%{O-1.49pt}%{O1.49pt}
ws-icon-1 = 2;%{O-4.8pt}%{O3px}%{T11}%{O4.8pt}%{O-3px}
ws-icon-2 = 3;%{O-2.24pt}%{T11}%{O2.24pt}
ws-icon-3 = 4;%{O-2.24pt}%{T11}%{O2.24pt}
ws-icon-4 = 5;%{O-4.8pt}%{O3px}%{T11}%{O4.8pt}%{O-3px}
ws-icon-5 = 6;%{O-1.49pt}%{O1.49pt}
ws-icon-6 = 7;%{O-1.49pt}%{T13}%{O1.49pt}
ws-icon-7 = 8;%{O-2.24pt}%{O2.24pt}
ws-icon-8 = 9;%{O-4.8pt}%{O3px}%{T12}%{O4.8pt}%{O-3px}
ws-icon-9 = 10;%{O-1.49pt}%{O1.49pt}
ws-icon-10 = 11;%{O-0.65pt}%{T11}%{O0.65pt}
ws-icon-11 = 12;%{O-0.65pt}%{T12}%{O0.65pt}
ws-icon-12 = 13;%{O-1.49pt}%{O1.49pt}
ws-icon-13 = 14;%{O-1.49pt}%{T11}%{O1.49pt}
ws-icon-14 = 15;%{O-1.49pt}%{T12}%{O1.49pt}
ws-icon-15 = 16;%{O-0.65pt}%{T12}%{O0.65pt}
ws-icon-16 = 17;%{O-0.65pt}%{T11}%{O0.65pt}
ws-icon-default = %{O-2.24pt}%{O2.24pt}
label-focused = ${workspace-labels.focused}
label-focused-padding = 0
label-unfocused = ${workspace-labels.unfocused}
label-unfocused-padding = 0
label-visible = ${workspace-labels.visible}
label-visible-padding = 0
label-urgent = ${workspace-labels.urgent}
label-urgent-padding = 0

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status.sh
interval = 5
click-left = ~/.config/polybar/scripts/vpn-status.sh info
[module/cpu]
type = internal/cpu
interval = 4
label = %{O4px}%percentage:2%%
label-foreground = ${colors.secondary}
[module/memory]
type = internal/memory
interval = 8
label = %{O4px}%percentage_used:2%%
label-foreground = ${colors.secondary}
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = ~/.config/polybar/scripts/wifi-menu.sh
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %{O4px}%percentage%%
label-muted = 
label-muted-foreground = ${colors.secondary}
click-right = pavucontrol
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/macos-battery.sh
interval = 30
[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
format = <label>
format-prefix = %{O2px}
label = %date%  %time%

[module/keyboard]
; Native XKB state notifications; left-click cycles the existing groups.
type = internal/xkeyboard
format = <label-layout>
layout-icon-default = --
layout-icon-0 = us;EN
layout-icon-1 = ir;FA
label-layout = %icon%
