include-file = ~/.config/polybar/themes/current.ini
include-file = ~/.config/polybar/modules.ini
[bar/base]
monitor = ${env:MONITOR}
monitor-strict = true
dpi = ${env:BAR_DPI:96}
height = ${env:BAR_HEIGHT:30}
offset-y = ${env:BAR_TOP:8}
background = ${colors.background}
foreground = ${colors.foreground}
radius = 14
border-size = 0
padding = 2
module-margin = 1
font-0 = SF Pro Display:style=Medium:size=10;2
font-1 = Font Awesome 5 Brands:size=10;2
font-2 = icomoon:size=10;2
font-3 = Symbols Nerd Font:size=11;2
font-4 = Font Awesome 5 Free:style=Solid:size=10;2
font-5 = Symbols Nerd Font:size=18;3
font-6 = Noto Sans:size=10;2
font-7 = DejaVu Sans:size=10;2
override-redirect = true
wm-restack = i3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize
[bar/left]
inherit = bar/base
width = ${env:LEFT_WIDTH}
offset-x = ${env:LEFT_X}
modules-left = apple global-menu i3
padding-left = 12px
padding-right = 2px
module-margin = 0
font-8 = Font Awesome 5 Brands:size=8.75;2
font-9 = SF Pro Display:style=Semibold:size=10;2
[bar/center]
inherit = bar/base
width = ${env:CENTER_WIDTH}
offset-x = ${env:CENTER_X}
modules-center = vpn
padding = 0
[bar/right]
inherit = bar/base
width = ${env:RIGHT_WIDTH}
offset-x = ${env:RIGHT_X}
# Pixel units avoid font-dependent spacing; adjacent 7px margins total 14px.
module-margin = 7px
padding = 12px
modules-center = ${env:RIGHT_MODULES:cpu memory network pulseaudio battery keyboard date}
[bar/reserve]
monitor = ${env:MONITOR}
width = 100%
height = ${env:RESERVE_HEIGHT:46}
background = #00000000
foreground = #00000000
font-0 = sans:size=1
modules-left = spacer
override-redirect = false
enable-struts = true
enable-ipc = true
[settings]
screenchange-reload = false
pseudo-transparency = false
