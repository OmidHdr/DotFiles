[module/spacer]
type = custom/text
format = " "
[module/apple]
type = custom/text
format = 
click-left = nohup ~/.local/bin/polybar-theme toggle >/dev/null 2>&1 &
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
fuzzy-match = false
format = <label-state>
format-font = 2
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-10 = 11;
ws-icon-11 = 12;
ws-icon-12 = 13;
ws-icon-13 = 14;
ws-icon-14 = 15;
ws-icon-15 = 16;
ws-icon-16 = 17;
ws-icon-default = 
label-focused = ${workspace-labels.focused}
label-focused-padding = 0
label-unfocused = ${workspace-labels.unfocused}
label-unfocused-padding = 0
label-visible = ${workspace-labels.visible}
label-visible-padding = 0
label-urgent = ${workspace-labels.urgent}
label-urgent-padding = 0

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status.sh
interval = 5
click-left = ~/.config/polybar/scripts/vpn-status.sh info
[module/cpu]
type = internal/cpu
interval = 4
label = %{O4px}%percentage:2%%
label-foreground = ${colors.secondary}
[module/memory]
type = internal/memory
interval = 8
label = %{O4px}%percentage_used:2%%
label-foreground = ${colors.secondary}
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = ~/.config/polybar/scripts/wifi-menu.sh
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %{O4px}%percentage%%
label-muted = 
label-muted-foreground = ${colors.secondary}
click-right = pavucontrol
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/macos-battery.sh
interval = 30
[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
format = <label>
format-prefix = %{O2px}
label = %date%  %time%

[module/keyboard]
; Native XKB state notifications; left-click cycles the existing groups.
type = internal/xkeyboard
format = <label-layout>
layout-icon-default = --
layout-icon-0 = us;EN
layout-icon-1 = ir;FA
label-layout = %icon%
label-layout-padding = 1
label-layout-foreground = ${colors.keyboard-foreground}
label-layout-background = ${colors.keyboard-background}
