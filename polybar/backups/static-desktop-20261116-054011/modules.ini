[module/spacer]
type = custom/text
format = " "
[module/apple]
type = custom/text
format = 
click-left = nohup ~/.local/bin/polybar-theme toggle >/dev/null 2>&1 &
[module/title]
type = internal/xwindow
label = %title:0:20:…%
label-empty = Desktop
label-maxlen = 21
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
format = <label-state> <label-mode>
label-focused = %name%
label-focused-background = ${colors.selected}
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.secondary}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.accent}
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = #D95050
label-urgent-foreground = #FFFFFF
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${colors.accent}
[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status.sh
interval = 5
click-left = ~/.config/polybar/scripts/vpn-status.sh info
[module/cpu]
type = internal/cpu
interval = 4
label =  %percentage:2%%
label-foreground = ${colors.secondary}
[module/memory]
type = internal/memory
interval = 8
label =  %percentage_used:2%%
label-foreground = ${colors.secondary}
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = ~/.config/polybar/scripts/network.sh info
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-muted = 
label-muted-foreground = ${colors.secondary}
click-right = pavucontrol
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/macos-battery.sh
interval = 30
[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
